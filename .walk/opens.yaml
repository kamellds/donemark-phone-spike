appId: com.kamellds.donemark_phone_spike
name: The first screen shows the app's name
---
- takeScreenshot: 1-opened
- extendedWaitUntil:
    visible: "A new app"
    timeout: 60000
- takeScreenshot: 2-loaded
- tapOn:
    text: "Continue"
    optional: true
- takeScreenshot: 3-after-continue
- assertVisible: "A new app"
- takeScreenshot: 4-seen
